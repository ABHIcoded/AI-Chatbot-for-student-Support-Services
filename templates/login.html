```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        height:100vh;
        background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }

    .background-circle{
        position:absolute;
        width:450px;
        height:450px;
        background:rgba(255,255,255,0.08);
        border-radius:50%;
        top:-120px;
        right:-120px;
    }

    .background-circle2{
        position:absolute;
        width:350px;
        height:350px;
        background:rgba(255,255,255,0.06);
        border-radius:50%;
        bottom:-100px;
        left:-100px;
    }

    .login-card{
        width:100%;
        max-width:430px;
        background:rgba(255,255,255,0.12);
        backdrop-filter:blur(18px);
        border:1px solid rgba(255,255,255,0.18);
        border-radius:24px;
        padding:40px 35px;
        box-shadow:0 25px 50px rgba(0,0,0,0.35);
        position:relative;
        z-index:10;
    }

    .logo{
        width:90px;
        height:90px;
        border-radius:50%;
        background:linear-gradient(135deg,#3b82f6,#8b5cf6);
        display:flex;
        justify-content:center;
        align-items:center;
        margin:0 auto 20px;
        color:white;
        font-size:36px;
    }

    h2{
        color:white;
        text-align:center;
        font-weight:700;
        margin-bottom:5px;
    }

    .subtitle{
        color:#cbd5e1;
        text-align:center;
        margin-bottom:30px;
        font-size:15px;
    }

    .form-control{
        background:rgba(255,255,255,0.9);
        border:none;
        border-radius:14px;
        padding:14px 16px;
        margin-bottom:18px;
    }

    .form-control:focus{
        box-shadow:0 0 0 0.25rem rgba(59,130,246,0.25);
    }

    .input-group-text{
        background:rgba(255,255,255,0.9);
        border:none;
        border-radius:14px 0 0 14px;
    }

    .btn-login{
        width:100%;
        padding:14px;
        border:none;
        border-radius:14px;
        background:linear-gradient(135deg,#2563eb,#1d4ed8);
        color:white;
        font-weight:600;
        font-size:16px;
        transition:0.3s;
    }

    .btn-login:hover{
        transform:translateY(-2px);
        box-shadow:0 12px 24px rgba(37,99,235,0.35);
    }

    .demo-box{
        background:rgba(255,255,255,0.12);
        border-radius:14px;
        padding:15px;
        margin-top:22px;
        color:#e5e7eb;
        font-size:14px;
    }

    .demo-box b{
        color:white;
    }

    .footer{
        text-align:center;
        color:#cbd5e1;
        margin-top:20px;
        font-size:13px;
    }

    .alert{
        border-radius:12px;
    }
</style>
```

</head>
<body>

<div class="background-circle"></div>
<div class="background-circle2"></div>

<div class="login-card">

```
<div class="logo">
    <i class="fas fa-graduation-cap"></i>
</div>

<h2>GNIOT AI Portal</h2>

<p class="subtitle">
    Student Support Services & AI Assistant
</p>

{% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
{% endif %}

<form method="POST">

    <div class="input-group mb-3">
        <span class="input-group-text">
            <i class="fas fa-id-card"></i>
        </span>
        <input
            type="text"
            name="enrollment"
            class="form-control"
            placeholder="Enrollment Number"
            required>
    </div>

    <div class="input-group mb-3">
        <span class="input-group-text">
            <i class="fas fa-lock"></i>
        </span>
        <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Password"
            required>
    </div>

    <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> Login to Portal
    </button>

</form>
